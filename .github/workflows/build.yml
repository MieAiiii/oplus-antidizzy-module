name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools and platform
        run: |
          sdkmanager --install "build-tools;35.0.0" "platforms;android-36" > /dev/null
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      # 固定签名，否则升级安装会因签名不一致失败。
      # 未配置 Secret 时脚本会生成临时签名，仅够验证编译通过。
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p build
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > build/debug.keystore
            echo "使用仓库 Secrets 中的固定签名"
          else
            echo "::warning::未配置 KEYSTORE_B64，本次使用临时签名，产物不可用于升级安装"
          fi

      - name: Build APK
        run: ./build/build-apk.sh

      - name: Build module zip
        run: ./build/build-module.sh

      - name: Show artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oplus-antidizzy-module
          path: |
            dist/*.zip
            dist/*.apk
          if-no-files-found: error

      # 只有打 tag 时才发 Release；平时 push 到 main 只做构建验证
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
